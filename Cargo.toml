[workspace]
members = [
    "crates/api-types",
    "crates/config",
    "crates/core",
    "crates/metainfo",
    "crates/net",
    "crates/persistence",
    "crates/storage",
    "crates/daemon",
    "crates/engine",
    "crates/cli",
    "crates/simulator",
    "crates/benchmarks",
]
resolver = "3"

[workspace.package]
authors = ["Kenan Sulayman"]
edition = "2024"
rust-version = "1.94"
version = "2.0.0-alpha.1"
license = "ISC"

[workspace.dependencies]
axum = { version = "0.8.9", features = ["http2", "json", "macros", "multipart", "ws"] }
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
base64 = "0.22.1"
bytes = { version = "1.11.1", features = ["serde"] }
cap-std = "4.0.3"
cap-fs-ext = "4.0.3"
clap = { version = "4.6.6", features = ["derive", "env"] }
config = { version = "0.15.22", default-features = false, features = ["toml"] }
criterion = "0.8.2"
crypto-bigint = { version = "0.5.5", default-features = false }
data-encoding = "2.10.0"
futures-util = "0.3.32"
hex = "0.4.3"
http = "1.4.0"
librqbit-utp = "0.7.0"
multibase = "0.9.3"
openssl = "0.10"
percent-encoding = "2.3.2"
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
rand = "0.10.0"
redb = "4.2.0"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "multipart", "rustls", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1.0.149"
sha1 = "0.11.0"
sha2 = "0.11.0"
socket2 = "0.6.1"
subtle = "2.6.1"
tempfile = "3.23.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-uring = { version = "0.5.0", features = ["bytes"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.0", features = ["catch-panic", "cors", "request-id", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1.26.0", features = ["serde", "v7"] }
url = "2.5.8"
unicode-normalization = "0.1.24"

[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "deny", priority = -1 }
unused_lifetimes = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
todo = "deny"
unimplemented = "deny"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
strip = "debuginfo"

[profile.profiling]
inherits = "release"
debug = true
strip = "none"
