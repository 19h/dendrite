[package]
name = "dendrite-engine"
description = "Supervised torrent actors for Dendrite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[features]
fault-injection = [
    "dendrite-persistence/fault-injection",
    "dendrite-storage/fault-injection",
]

[dependencies]
openssl.workspace = true
bytes.workspace = true
futures-util.workspace = true
rand.workspace = true
reqwest.workspace = true
sha1.workspace = true
sha2.workspace = true
dendrite-core = { path = "../core", version = "2.0.0-alpha.1" }
dendrite-metainfo = { path = "../metainfo", version = "2.0.0-alpha.1" }
dendrite-net = { path = "../net", version = "2.0.0-alpha.1" }
dendrite-persistence = { path = "../persistence", version = "2.0.0-alpha.1" }
dendrite-storage = { path = "../storage", version = "2.0.0-alpha.1" }
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
url.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
