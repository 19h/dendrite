# Safe local example. Run from the repository root with:
#   target/release/dendrite --config example.toml
data_dir = "./dendrite-data"
download_dir = "./downloads"

[listen]
# The administrator API is loopback-only by default. See the remote API
# playbook before exposing it on another interface.
api = "127.0.0.1:8412"
peer = "0.0.0.0:16493"
dht = "0.0.0.0:16309"

# Public IPv4 bootstrap nodes let DHT widen discovery beyond tracker results.
dht_bootstrap = [
  "87.98.162.88:6881",   # dht.transmissionbt.com
  "212.129.33.59:6881",  # dht.transmissionbt.com
]

# NAT-PMP is opt-in. Uncomment only when this is the actual local IPv4 gateway.
# nat_pmp_gateway = "192.168.1.1:5351"

# disabled | preferred | plaintext_preferred | required
# plaintext_preferred dials plaintext first and falls back to MSE, which saves
# the per-byte RC4 cost for every peer that allows plaintext; inbound
# encrypted peers are still accepted.
peer_encryption = "plaintext_preferred"

# These are required together when api is not bound to loopback:
# tls_certificate = "/etc/dendrite/tls/cert.pem"
# tls_private_key = "/etc/dendrite/tls/key.pem"
allowed_origins = []

[limits]
loaded_torrents = 10000
active_torrents = 1000
peer_connections = 10000
metainfo_bytes = 67108864
tracker_response_bytes = 8388608
websocket_message_bytes = 8388608
api_concurrency = 256
api_requests_per_second = 1000
browser_sessions = 1024
list_page_size = 200
# Piece buffers assigned to downloading peers across all torrents, and verified
# pieces cached for uploads. Raise both on hosts with memory to spare and many
# peers on large-piece torrents.
download_buffer_bytes = 17179869184
piece_cache_bytes = 1073741824

[storage]
# Seconds between the group fsync barriers that commit verified pieces. On
# ZFS with a separate log device, a longer interval keeps most payload out of
# the log; a crash can force at most this many seconds of pieces to re-download.
flush_interval_seconds = 20

[transfer]
# Regular slots reward peers by the rate they deliver verified data; optimistic
# slots audition newcomers. Upload while downloading is capped per peer at the
# hourly bootstrap plus reciprocal_ratio times what the peer delivered.
upload_slots = 16
optimistic_upload_slots = 12
reciprocal_ratio = 0.5
reciprocal_bootstrap_bytes = 16777216
# Hard egress caps, both per torrent: bytes per second (0 = unlimited) and the
# uploaded/downloaded ratio at which every peer is choked (0 = off).
upload_rate_limit_bytes = 10485760
torrent_max_upload_ratio = 0.5

[logging]
filter = "dendrite=info"
json = false
